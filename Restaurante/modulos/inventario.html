<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <style>
        body {
            background-color: rgb(245, 244, 247);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }


        .field {
            width: 100%;
            max-width: 400px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!--Nombre_Producto -->
    <div class="field">
        <label class="label">Nombre del Producto
            <div class="control">
                <input class="input" type="text" placeholder="Ingresa texto">
            </div>
    </div>

    <!--Código_producto -->
    <div class="field">
        <label class="label">Código del producto
            <div class="control">
                <input class="input" type="text" placeholder="Ingresa números">
            </div>
    </div>

    <!--Cantidad -->
    <div class="field">
        <label class="label">Cantidad
            <div class="control">
                <input class="input" type="text" placeholder="Ingresa números">
            </div>
    </div>

    <!--Marca_Producto -->
    <div class="field">
        <label class="label">Marca del Producto
            <div class="control">
                <input class="input" type="text" placeholder="Ingresa texto">
            </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

</head>

<body>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-10-tablet is-8-desktop is-6-widescreen">
                    <div class="inventory-form">
                        <h1 class="title has-text-centered">Formulario de Inventario</h1>
                        <form>
                            <div class="field">
                                <label class="label">Código del Producto</label>
                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingresa el código del producto"
                                        required id="codigo_producto">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Nombre del Producto</label>
                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingresa el nombre del producto"
                                        required id="nombre_producto">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Cantidad de Productos</label>
                                <div class="control">
                                    <input class="input" type="number" min="1" placeholder="Ingresa la cantidad"
                                        required id="cantidad_producto">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Marca del Producto</label>
                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingresa la marca" required id="marca_producto">
                                </div>
                            </div>

                            <div class="field mt-5">
                                <div class="control">
                                    <button class="button is-primary" id="btnGuardar" is-fullwidth>Guardar</button>
                                </div>

                                <div class="field mt-5">
                                    <div class="control">
                                        <a class="button is-primary is-medium" href="../index.html">
                                            Volver
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inventario.js"></script>
</body>

</html>

<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
  <link rel="stylesheet" href="../css/usuarios.css">
  <title>Usuario - Restaurante</title>

</head>

<body>
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-10-tablet is-8-desktop is-6-widescreen">
          <div class="form-box">
            <h1 class="title has-text-centered form-title">Formulario de Usuario</h1>
            <form>
              
              <div class="field">
                <label class="label">Nombre</label>
                <div class="control">
                  <input class="input" type="text" placeholder="Juan" id="nombre" required />
                </div>
              </div>

               <div class="field">
                <label class="label">Apellido</label>
                <div class="control">
                  <input class="input" type="text" placeholder="Pérez" id="apellido" required />
                </div>
              </div>

              <div class="field">
                <label class="label">Tipo de Documento</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select id="tipo_documento" required>
                      <option value="">Selecciona una opción</option>
                      <option>C.C</option>
                      <option>T.I</option>
                      <option>Otro</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label">Número de Documento</label>
                <div class="control">
                  <input class="input" type="text" placeholder="123456789" id="numero_documento" required />
                </div>
              </div>

              <div class="field">
                <label class="label">Teléfono</label>
                <div class="control">
                  <input class="input" type="tel" placeholder="3001234567" required id="telefono" />
                </div>
              </div>

              <div class="field">
                <label class="label">Correo Electrónico</label>
                <div class="control">
                  <input class="input" type="email" placeholder="usuario@email.com" id="correo_electronico" required />
                </div>
              </div>

              <div class="field">
                <label class="label">Género</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select id="genero" required>
                      <option value="">Selecciona una opción</option>
                      <option>Masculino</option>
                      <option>Femenino</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label">Fecha de Nacimiento</label>
                <div class="control">
                  <input class="input" type="date" id="fecha_nacimiento" required />
                </div>
              </div>

              <div class="field">
                <label class="label">Cargo</label>
                <div class="control">
                  <input class="input" type="text" placeholder="Escribe el cargo" id="cargo" required />
                </div>
              </div>

              <div class="field">
                <label class="label">Contraseña</label>
                <div class="control">
                  <input class="input" type="password" placeholder="••••••••" id="contraseña" required />
                </div>
              </div>

              <div class="field mt-5">
                <div class="control">
                  <button class="button is-link is-fullwidth">Enviar</button>
                </div>

                <div class="field mt-5">
                  <div class="control">
                    <a class="button is-primary is-medium" href="../index.html">
                      Volver
                    </a>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="../js/usuario.js"></script>
</body>

</html>
